[package]
name = "vsc-light"
version = "0.1.0"
edition = "2024"
default-run = "vsc-light"

[[bin]]
name = "vsc-light"
path = "src/main.rs"

[[bin]]
name = "node-clone"
path = "src/node-clone/main.rs"

[dependencies]
gtk4 = { version = "0.11.5", features = ["v4_10"] }
webkit6 = "0.6.1"
serde_json = "1"
javascriptcore6 = "0.6.0"
libc = "0.2"
